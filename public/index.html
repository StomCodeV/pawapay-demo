<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pay 100 RWF</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 400px; margin: auto; text-align: center;}
        button { width: 100%; padding: 15px; margin: 20px 0; border-radius: 6px; border: none; background: #6b21a8; color: white; font-size: 18px; cursor: pointer; }
        #status { margin-top: 15px; font-weight: bold; color: #555; }
    </style>
</head>
<body>
    <h2>Unlock Premium</h2>
    <p>Click below to pay 100 RWF securely via Mobile Money.</p>

    <button onclick="payNow()">Pay 100 RWF</button>
    <p id="status"></p>

    <script>
        async function payNow() {
            const status = document.getElementById('status');
            status.innerText = 'Initiating payment...';

            try {
                const res = await fetch('/api/create-payment', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: 100 })
                });
                
                const data = await res.json();
                
                if (data.success && data.redirectUrl) {
                    status.innerText = 'Redirecting to PawaPay...';
                    // THIS IS THE MAGIC FIX: Send the user to PawaPay's page
                    window.location.href = data.redirectUrl; 
                } else {
                    status.innerText = '❌ Error: ' + JSON.stringify(data.error);
                }
            } catch (e) {
                status.innerText = '❌ Network error';
            }
        }
    </script>
</body>
</html>
